[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "loglens"
version = "0.1.0"
description = "Log anomaly analyzer: clusters logs into templates, surfaces what's new/spiking vs baseline, and explains it in plain English."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Tanishq Patil", email = "tanishq17patil@gmail.com" }]
keywords = ["logs", "anomaly-detection", "observability", "drain3", "llm"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Topic :: System :: Logging",
]

dependencies = [
    "drain3>=0.9.11",
    "typer>=0.12",
    "rich>=13.0",
]

[project.optional-dependencies]
llm = ["anthropic>=0.40"]
dev = ["pytest>=8.0", "ruff>=0.6"]

[project.scripts]
loglens = "loglens.cli:app"

[project.urls]
Repository = "https://github.com/tpatil17/log-lens"

[tool.hatch.build.targets.wheel]
packages = ["src/loglens"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
